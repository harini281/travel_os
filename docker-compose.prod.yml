services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in deploy/production.env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in deploy/production.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/production.env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [data]
  migrate:
    image: postgres:16-alpine
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:?Set POSTGRES_DB}
      PGUSER: ${POSTGRES_USER:?Set POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - ./database/migrations:/migrations:ro
      - ./deploy/migrate.sh:/migrate.sh:ro
    entrypoint: ["/bin/sh", "/migrate.sh"]
    networks: [data]
  ai-api:
    build:
      context: .
      dockerfile: services/ai-api/Dockerfile
    restart: unless-stopped
    environment:
      AI_PROVIDER: ${AI_PROVIDER:-demo}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      AI_RECEIPT_PROVIDER: ${AI_RECEIPT_PROVIDER:-demo}
    expose: ["8001"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 5
    networks: [app]
  receipt-storage-init:
    image: alpine:3.20
    restart: "no"
    command: ["sh", "-c", "mkdir -p /var/lib/travelos/receipts && chown -R 1654:1654 /var/lib/travelos/receipts"]
    volumes:
      - receipts-data:/var/lib/travelos/receipts
    networks: [data]

  platform-api:
    build:
      context: .
      dockerfile: services/platform-api/Dockerfile
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      ai-api:
        condition: service_healthy
      receipt-storage-init:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__TravelOS: ${TRAVELOS_CONNECTION_STRING:?Set TRAVELOS_CONNECTION_STRING}
      Jwt__Issuer: ${JWT_ISSUER:?Set JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE:?Set JWT_AUDIENCE}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY}
      Cors__AllowedOrigins__0: ${CORS_ALLOWED_ORIGIN:?Set CORS_ALLOWED_ORIGIN}
      AiService__BaseUrl: http://ai-api:8001
      Receipts__StoragePath: /var/lib/travelos/receipts
      FLIGHTAWARE_API_KEY: ${FLIGHTAWARE_API_KEY:-}
    volumes: [receipts-data:/var/lib/travelos/receipts]
    expose: ["8080"]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    networks: [app, data]
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_PLATFORM_API_URL: ""
    restart: unless-stopped
    depends_on:
      platform-api:
        condition: service_healthy
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8088}:8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 5
    networks: [app]
volumes:
  postgres-data:
  receipts-data:
networks:
  app:
    driver: bridge
  data:
    driver: bridge
    internal: true
