name: TravelOS CI

on:
  push:
    branches: [main, 'stage*']
  pull_request:
    branches: [main, 'stage*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: Web typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build

  ai-api:
    name: AI API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/ai-api/requirements-dev.txt
      - name: Validate operational scripts and production env-file ignore rules
        run: |
          bash -n deploy/backup.sh deploy/verify-backup.sh
          sh -n deploy/migrate.sh
          git check-ignore --quiet deploy/production.env
          for sample in .env.example apps/web/.env.example deploy/production.env.example; do
            if git check-ignore --quiet "$sample"; then
              echo "::error::$sample must remain trackable as an example template."
              exit 1
            fi
          done
      - name: Run tests
        run: pytest -q

  platform-api:
    name: Platform API build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore services/platform-api/TravelOS.PlatformApi.csproj
      - name: Build
        run: dotnet build services/platform-api/TravelOS.PlatformApi.csproj --no-restore --configuration Release

  platform-api-tests:
    name: Platform API unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Run platform API tests
        run: dotnet test tests/platform-api-tests/TravelOS.PlatformApi.Tests.csproj --configuration Release

  platform-api-integration-tests:
    name: Platform API PostgreSQL integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Start isolated PostgreSQL with a per-job random password
        env:
          POSTGRES_DB: travelos_test
          POSTGRES_USER: postgres
        run: |
          set +x
          set -euo pipefail
          umask 077
          postgres_password="$(openssl rand -hex 32)"
          echo "::add-mask::$postgres_password"
          printf '%s' "$postgres_password" > "$RUNNER_TEMP/travelos-postgres-password"
          export POSTGRES_PASSWORD="$postgres_password"
          docker run --detach --name travelos-postgres --publish 127.0.0.1:5432:5432 \
            --env POSTGRES_DB --env POSTGRES_USER --env POSTGRES_PASSWORD postgres:16
          unset postgres_password POSTGRES_PASSWORD
          for attempt in $(seq 1 60); do
            if docker exec travelos-postgres pg_isready -U postgres -d travelos_test >/dev/null 2>&1; then
              echo "Disposable PostgreSQL is ready"
              exit 0
            fi
            sleep 2
          done
          docker logs travelos-postgres 2>&1 | python -c 'import pathlib,sys; secret=pathlib.Path(sys.argv[1]).read_text().strip(); text=sys.stdin.read(); sys.stdout.write(text.replace(secret, "[REDACTED]") if secret else text)' "$RUNNER_TEMP/travelos-postgres-password"
          exit 1
      - name: Prepare integration-test database
        run: |
          set +x
          set -euo pipefail
          export PGPASSWORD="$(cat "$RUNNER_TEMP/travelos-postgres-password")"
          for migration in \
            001_initial_schema.sql \
            002_identity_schema.sql \
            003_itinerary_constraints.sql \
            003_trip_invitations.sql \
            004_trip_member_preferences.sql \
            005_group_polls.sql \
            006_shared_expenses.sql \
            007_trip_repayments.sql \
            008_trip_expense_audits.sql \
            009_trip_receipts.sql \
            010_currency_conversions.sql \
            011_conversion_source_expense_date.sql \
            012_trip_budget_alerts.sql \
            013_trip_weather_assessments.sql \
            014_trip_flights.sql \
            015_flight_journey_groups.sql \
            016_activity_schedule_times.sql \
            017_trip_notifications.sql
          do
            echo "Applying $migration"
            docker run --rm --network host --env PGPASSWORD --volume "$PWD:/workspace:ro" --workdir /workspace postgres:16.6-bookworm psql -h 127.0.0.1 -U postgres -d travelos_test -v ON_ERROR_STOP=1 -f "database/migrations/$migration"
          done
      - name: Run PostgreSQL-backed API integration tests
        run: |
          set +x
          set -euo pipefail
          postgres_password="$(cat "$RUNNER_TEMP/travelos-postgres-password")"
          export TRAVELOS_TEST_CONNECTION_STRING="Host=localhost;Port=5432;Database=travelos_test;Username=postgres;Password=$postgres_password"
          unset postgres_password
          dotnet test tests/platform-api-tests/TravelOS.PlatformApi.Tests.csproj --configuration Release --logger "console;verbosity=normal"
      - name: Stop isolated PostgreSQL and remove credentials
        if: always()
        run: |
          set +x
          docker rm --force --volumes travelos-postgres >/dev/null 2>&1 || true
          rm -f "$RUNNER_TEMP/travelos-postgres-password"



  browser-e2e:
    name: Cross-browser, mobile and accessibility E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Start isolated PostgreSQL with a per-job random password
        env:
          POSTGRES_DB: travelos_e2e
          POSTGRES_USER: postgres
        run: |
          set +x
          set -euo pipefail
          umask 077
          postgres_password="$(openssl rand -hex 32)"
          echo "::add-mask::$postgres_password"
          printf '%s' "$postgres_password" > "$RUNNER_TEMP/travelos-postgres-password"
          export POSTGRES_PASSWORD="$postgres_password"
          docker run --detach --name travelos-postgres --publish 127.0.0.1:5432:5432 \
            --env POSTGRES_DB --env POSTGRES_USER --env POSTGRES_PASSWORD postgres:16
          unset postgres_password POSTGRES_PASSWORD
          for attempt in $(seq 1 60); do
            if docker exec travelos-postgres pg_isready -U postgres -d travelos_e2e >/dev/null 2>&1; then
              echo "Disposable PostgreSQL is ready"
              exit 0
            fi
            sleep 2
          done
          docker logs travelos-postgres 2>&1 | python -c 'import pathlib,sys; secret=pathlib.Path(sys.argv[1]).read_text().strip(); text=sys.stdin.read(); sys.stdout.write(text.replace(secret, "[REDACTED]") if secret else text)' "$RUNNER_TEMP/travelos-postgres-password"
          exit 1
      - name: Apply migrations to disposable E2E database
        run: |
          set +x
          set -euo pipefail
          export PGPASSWORD="$(cat "$RUNNER_TEMP/travelos-postgres-password")"
          for migration in \
            001_initial_schema.sql \
            002_identity_schema.sql \
            003_itinerary_constraints.sql \
            003_trip_invitations.sql \
            004_trip_member_preferences.sql \
            005_group_polls.sql \
            006_shared_expenses.sql \
            007_trip_repayments.sql \
            008_trip_expense_audits.sql \
            009_trip_receipts.sql \
            010_currency_conversions.sql \
            011_conversion_source_expense_date.sql \
            012_trip_budget_alerts.sql \
            013_trip_weather_assessments.sql \
            014_trip_flights.sql \
            015_flight_journey_groups.sql \
            016_activity_schedule_times.sql \
            017_trip_notifications.sql
          do
            echo "Applying $migration"
            docker run --rm --network host --env PGPASSWORD --volume "$PWD:/workspace:ro" --workdir /workspace postgres:16.6-bookworm psql -h 127.0.0.1 -U postgres -d travelos_e2e -v ON_ERROR_STOP=1 -f "database/migrations/$migration"
          done
      - name: Install web dependencies
        working-directory: apps/web
        run: npm install
      - name: Typecheck web application
        working-directory: apps/web
        run: npm run typecheck
      - name: Build web application
        working-directory: apps/web
        run: npm run build
      - name: Install Chromium, Firefox, WebKit and Linux dependencies
        working-directory: apps/web
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Start deterministic AI recommendation mock
        run: |
          set -euo pipefail
          E2E_AI_MOCK_PORT=8011 node tests/e2e/mock-ai-server.mjs > "$RUNNER_TEMP/travelos-ai-mock.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/travelos-ai-mock.pid"
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8011/health >/dev/null; then
              echo "AI recommendation mock is ready"
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/travelos-ai-mock.log"
          exit 1
      - name: Start Platform API against E2E PostgreSQL database
        env:
          ASPNETCORE_URLS: http://127.0.0.1:8080
          ASPNETCORE_ENVIRONMENT: Testing
          Jwt__Issuer: TravelOS.Playwright
          Jwt__Audience: TravelOS.Playwright.Client
          RateLimits__AuthPerMinute: 30
          Cors__AllowedOrigins__0: http://127.0.0.1:5173
          AiService__BaseUrl: http://127.0.0.1:8011
          Receipts__StoragePath: ${{ runner.temp }}/travelos-playwright-receipts
        run: |
          set +x
          set -euo pipefail
          postgres_password="$(cat "$RUNNER_TEMP/travelos-postgres-password")"
          jwt_signing_key="$(openssl rand -hex 48)"
          ai_service_token="$(openssl rand -hex 48)"
          echo "::add-mask::$jwt_signing_key"
          echo "::add-mask::$ai_service_token"
          mkdir -p "$Receipts__StoragePath"
          export ConnectionStrings__TravelOS="Host=localhost;Port=5432;Database=travelos_e2e;Username=postgres;Password=$postgres_password"
          env Jwt__SigningKey="$jwt_signing_key" AI_SERVICE_TOKEN="$ai_service_token" dotnet run --project services/platform-api/TravelOS.PlatformApi.csproj --configuration Release --no-launch-profile > "$RUNNER_TEMP/travelos-platform-api.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/travelos-platform-api.pid"
          unset jwt_signing_key ai_service_token postgres_password ConnectionStrings__TravelOS
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null; then
              echo "Platform API is ready"
              exit 0
            fi
            if ! kill -0 "$(cat "$RUNNER_TEMP/travelos-platform-api.pid")" 2>/dev/null; then
              echo "Platform API exited before becoming healthy; see redacted diagnostics below."
              exit 1
            fi
            sleep 2
          done
          echo "Platform API did not become healthy; see redacted diagnostics below."
          exit 1
      - name: Run Chromium, Firefox, WebKit, mobile and tablet journeys
        working-directory: apps/web
        env:
          CI: "true"
          VITE_PLATFORM_API_URL: http://127.0.0.1:8080
          E2E_API_URL: http://127.0.0.1:8080
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:5173
        run: npm run test:e2e
      - name: Redact Platform API diagnostics
        if: always()
        run: |
          set +x
          python - "$RUNNER_TEMP/travelos-platform-api.log" "$RUNNER_TEMP/travelos-postgres-password" <<'PY'
          import pathlib, re, sys
          log = pathlib.Path(sys.argv[1])
          if not log.exists():
              raise SystemExit(0)
          text = log.read_text(errors="replace")
          secret_file = pathlib.Path(sys.argv[2])
          if secret_file.exists():
              secret = secret_file.read_text().strip()
              if secret:
                  text = text.replace(secret, "[REDACTED]")
          text = re.sub(r"(?i)(password\s*[=:]\s*)[^;\s]+", r"\1[REDACTED]", text)
          text = re.sub(r"(?i)(jwt(?:__|:)?signingkey\s*[=:]\s*)[^;\s]+", r"\1[REDACTED]", text)
          text = re.sub(r"(?i)\b[0-9a-f]{96}\b", "[REDACTED]", text)
          log.write_text(text)
          PY
      - name: Upload cross-browser reports, screenshots and traces
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: travelos-playwright-e2e-results
          path: |
            apps/web/playwright-report/
            !apps/web/playwright-report/**/*.zip
            ${{ runner.temp }}/travelos-platform-api.log
            ${{ runner.temp }}/travelos-ai-mock.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Stop isolated PostgreSQL and remove credentials
        if: always()
        run: |
          set +x
          docker rm --force --volumes travelos-postgres >/dev/null 2>&1 || true
          rm -f "$RUNNER_TEMP/travelos-postgres-password"


  database-migrations:
    name: PostgreSQL migration validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Start isolated PostgreSQL with a per-job random password
        env:
          POSTGRES_DB: travelos
          POSTGRES_USER: postgres
        run: |
          set +x
          set -euo pipefail
          umask 077
          postgres_password="$(openssl rand -hex 32)"
          echo "::add-mask::$postgres_password"
          printf '%s' "$postgres_password" > "$RUNNER_TEMP/travelos-postgres-password"
          export POSTGRES_PASSWORD="$postgres_password"
          docker run --detach --name travelos-postgres --publish 127.0.0.1:5432:5432 \
            --env POSTGRES_DB --env POSTGRES_USER --env POSTGRES_PASSWORD postgres:16
          unset postgres_password POSTGRES_PASSWORD
          for attempt in $(seq 1 60); do
            if docker exec travelos-postgres pg_isready -U postgres -d travelos >/dev/null 2>&1; then
              echo "Disposable PostgreSQL is ready"
              exit 0
            fi
            sleep 2
          done
          docker logs travelos-postgres 2>&1 | python -c 'import pathlib,sys; secret=pathlib.Path(sys.argv[1]).read_text().strip(); text=sys.stdin.read(); sys.stdout.write(text.replace(secret, "[REDACTED]") if secret else text)' "$RUNNER_TEMP/travelos-postgres-password"
          exit 1
      - name: Apply all database migrations
        run: |
          set +x
          set -euo pipefail
          export PGPASSWORD="$(cat "$RUNNER_TEMP/travelos-postgres-password")"
          for migration in \
            001_initial_schema.sql \
            002_identity_schema.sql \
            003_itinerary_constraints.sql \
            003_trip_invitations.sql \
            004_trip_member_preferences.sql \
            005_group_polls.sql \
            006_shared_expenses.sql \
            007_trip_repayments.sql \
            008_trip_expense_audits.sql \
            009_trip_receipts.sql \
            010_currency_conversions.sql \
            011_conversion_source_expense_date.sql \
            012_trip_budget_alerts.sql \
            013_trip_weather_assessments.sql \
            014_trip_flights.sql \
            015_flight_journey_groups.sql \
            016_activity_schedule_times.sql \
            017_trip_notifications.sql
          do
            echo "Applying $migration"
            docker run --rm --network host --env PGPASSWORD --volume "$PWD:/workspace:ro" --workdir /workspace postgres:16.6-bookworm psql -h 127.0.0.1 -U postgres -d travelos -v ON_ERROR_STOP=1 -f "database/migrations/$migration"
          done
      - name: Stop isolated PostgreSQL and remove credentials
        if: always()
        run: |
          set +x
          docker rm --force --volumes travelos-postgres >/dev/null 2>&1 || true
          rm -f "$RUNNER_TEMP/travelos-postgres-password"

  container-deployment-smoke:
    name: Container deployment build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Create disposable deployment environment
        run: |
          set +x
          set -euo pipefail
          umask 077
          db_password="$(openssl rand -hex 32)"
          app_db_password="$(openssl rand -hex 32)"
          jwt_signing_key="$(openssl rand -hex 48)"
          echo "::add-mask::$app_db_password"
          echo "::add-mask::$db_password"
          echo "::add-mask::$jwt_signing_key"
          env_file="$RUNNER_TEMP/travelos-ci.env"
          {
            printf 'POSTGRES_DB=travelos\n'
            printf 'TRAVELOS_APP_DB_USER=travelos_app\n'
            printf 'TRAVELOS_APP_DB_PASSWORD=%s\n' "$app_db_password"
            printf 'POSTGRES_USER=travelos_migrator\n'
            printf 'POSTGRES_PASSWORD=%s\n' "$db_password"
            printf 'TRAVELOS_CONNECTION_STRING=Host=postgres;Port=5432;Database=travelos;Username=travelos_app;Password=%s\n' "$app_db_password"
            printf 'JWT_ISSUER=TravelOS.CI\n'
            printf 'JWT_AUDIENCE=TravelOS.CI.Client\n'
            printf 'JWT_SIGNING_KEY=%s\n' "$jwt_signing_key"
            printf 'CORS_ALLOWED_ORIGIN=https://127.0.0.1:8088\n'
            printf 'WEB_BIND_ADDRESS=127.0.0.1\n'
            printf 'WEB_PORT=8088\n'
            printf 'AI_PROVIDER=demo\n'
            printf 'OPENAI_API_KEY=\n'
            printf 'OPENAI_MODEL=gpt-4.1-mini\n'
            printf 'AI_RECEIPT_PROVIDER=demo\n'
            printf 'AI_SERVICE_TOKEN=%s\n' "$(openssl rand -hex 48)"
            printf 'FLIGHTAWARE_API_KEY=\n'
          } > "$env_file"
          chmod 600 "$env_file"
          unset db_password app_db_password jwt_signing_key
      - name: Validate Compose configuration
        run: |
          set +x
          docker compose --env-file "$RUNNER_TEMP/travelos-ci.env" -f docker-compose.prod.yml config --quiet
      - name: Build all application images
        run: |
          set +x
          docker compose --env-file "$RUNNER_TEMP/travelos-ci.env" -f docker-compose.prod.yml build
      - name: Record container runtime diagnostics
        run: |
          set +x
          set -euo pipefail
          docker info --format 'Docker host architecture: {{.Architecture}}'
          docker version
          dotnet --info || true
          uname -m
          cat /etc/os-release
          docker compose --env-file "$RUNNER_TEMP/travelos-ci.env" -f docker-compose.prod.yml create
          docker compose --env-file "$RUNNER_TEMP/travelos-ci.env" -f docker-compose.prod.yml images
          platform_image="$(docker compose --env-file "$RUNNER_TEMP/travelos-ci.env" -f docker-compose.prod.yml images --quiet platform-api)"
          if [ -z "$platform_image" ] || [ "$(printf '%s\n' "$platform_image" | grep -c .)" -ne 1 ]; then
            echo "::error::Compose did not return exactly one Platform API image ID after creating service containers."
            docker compose --env-file "$RUNNER_TEMP/travelos-ci.env" -f docker-compose.prod.yml images
            exit 1
          fi
          if ! docker image inspect "$platform_image" >/dev/null 2>&1; then
            echo "::error::Compose returned a Platform API image reference that Docker cannot inspect; refusing to invoke docker run."
            exit 1
          fi
          platform_image_id="$(docker image inspect --format '{{.Id}}' "$platform_image")"
          if [[ ! "$platform_image_id" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Docker returned an invalid Platform API image ID; refusing to invoke docker run."
            exit 1
          fi
          echo "Resolved and validated the Platform API image ID."
          docker image inspect "$platform_image_id" --format 'Platform API image: {{.Id}} OS={{.Os}} Architecture={{.Architecture}}'
          docker run --rm --entrypoint sh "$platform_image_id" -c 'dotnet --info; echo "Runtime executable dependencies:"; ldd "$(command -v dotnet)" || true; echo "Application native libraries:"; find /app -type f -name "*.so" -exec ldd {} \;'
          while IFS= read -r image; do
            [ -n "$image" ] || continue
            if ! docker image inspect "$image" >/dev/null 2>&1; then echo "::error::Compose reported an invalid local image ID: $image"; exit 1; fi
            docker image inspect "$image" --format 'Compose image: {{.Id}} OS={{.Os}} Architecture={{.Architecture}}'
          done < <(docker compose --env-file "$RUNNER_TEMP/travelos-ci.env" -f docker-compose.prod.yml images --quiet | sort -u)
      - name: Start deployment stack
        run: |
          set +x
          docker compose --env-file "$RUNNER_TEMP/travelos-ci.env" -f docker-compose.prod.yml up --detach --wait --wait-timeout 240
      - name: Verify web, API and AI health
        run: |
          set +x
          set -euo pipefail
          env_file="$RUNNER_TEMP/travelos-ci.env"
          docker compose --env-file "$env_file" -f docker-compose.prod.yml ps --all
          curl --fail --silent --show-error http://127.0.0.1:8088/ -o /dev/null
          headers="$(curl --fail --silent --show-error -D - -o /dev/null http://127.0.0.1:8088/)"
          printf '%s\n' "$headers" | grep -qi '^content-security-policy:'
          printf '%s\n' "$headers" | grep -qi '^x-content-type-options: nosniff'
          api_headers="$(curl --fail --silent --show-error -D - -o /dev/null http://127.0.0.1:8088/health)"
          printf '%s\n' "$api_headers" | grep -qi '^content-security-policy:'
          printf '%s\n' "$api_headers" | grep -qi '^cache-control: no-store'
          curl --fail --silent --show-error http://127.0.0.1:8088/health
          docker compose --env-file "$env_file" -f docker-compose.prod.yml exec -T ai-api python -c "import json,urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:8001/health')); assert data=={'status':'ok'}, data; print(data)"
          docker compose --env-file "$env_file" -f docker-compose.prod.yml exec -T platform-api sh -c 'test -w /var/lib/travelos/receipts'
      - name: Verify all database migrations were recorded
        run: |
          set +x
          set -euo pipefail
          count="$(docker compose --env-file "$RUNNER_TEMP/travelos-ci.env" -f docker-compose.prod.yml exec -T postgres psql -U travelos_migrator -d travelos -Atc 'SELECT count(*) FROM travelos_migration_history')"
          echo "Recorded migrations: $count"
          test "$count" = "18"
          app_role_admin_flags="$(docker compose --env-file "$RUNNER_TEMP/travelos-ci.env" -f docker-compose.prod.yml exec -T postgres psql -U travelos_migrator -d travelos -Atc "SELECT (rolsuper OR rolcreatedb OR rolcreaterole OR rolreplication OR rolbypassrls)::text FROM pg_roles WHERE rolname = 'travelos_app'")"
          echo "Application database role has elevated PostgreSQL privileges: $app_role_admin_flags"
          test "$app_role_admin_flags" = "false"
          app_role_database_create="$(docker compose --env-file "$RUNNER_TEMP/travelos-ci.env" -f docker-compose.prod.yml exec -T postgres psql -U travelos_migrator -d travelos -Atc "SELECT has_database_privilege('travelos_app', 'travelos', 'CREATE')::text")"
          test "$app_role_database_create" = "false"
          app_role_schema_create="$(docker compose --env-file "$RUNNER_TEMP/travelos-ci.env" -f docker-compose.prod.yml exec -T postgres psql -U travelos_migrator -d travelos -Atc "SELECT has_schema_privilege('travelos_app', 'public', 'CREATE')::text")"
          test "$app_role_schema_create" = "false"
          app_role_memberships="$(docker compose --env-file "$RUNNER_TEMP/travelos-ci.env" -f docker-compose.prod.yml exec -T postgres psql -U travelos_migrator -d travelos -Atc "SELECT count(*) FROM pg_auth_members WHERE member = (SELECT oid FROM pg_roles WHERE rolname = 'travelos_app')")"
          test "$app_role_memberships" = "0"
          migration_history_write="$(docker compose --env-file "$RUNNER_TEMP/travelos-ci.env" -f docker-compose.prod.yml exec -T postgres psql -U travelos_migrator -d travelos -Atc "SELECT has_table_privilege('travelos_app', 'travelos_migration_history', 'INSERT')::text")"
          test "$migration_history_write" = "false"
      - name: Verify internal-only ports and service network isolation
        run: |
          set +x
          set -euo pipefail
          for service in postgres platform-api ai-api; do
            container_id="$(docker compose --env-file "$RUNNER_TEMP/travelos-ci.env" -f docker-compose.prod.yml ps -q "$service")"
            test -n "$container_id"
            docker inspect "$container_id" --format '{{json .HostConfig.PortBindings}}' > "$RUNNER_TEMP/${service}-port-bindings.json"
            python -c "import json,sys; bindings=json.load(open(sys.argv[1])); assert not bindings or not any(bindings.values()), f'Unexpected published port bindings: {bindings}'; print(sys.argv[2] + ': no host-published ports')" "$RUNNER_TEMP/${service}-port-bindings.json" "$service"
          done
          for service in web platform-api ai-api; do
            container_id="$(docker compose --env-file "$RUNNER_TEMP/travelos-ci.env" -f docker-compose.prod.yml ps -q "$service")"
            docker inspect "$container_id" --format '{{json .NetworkSettings.Networks}}' > "$RUNNER_TEMP/${service}-networks.json"
          done
          python - "$RUNNER_TEMP" <<'PY'
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          networks = {
              name: set(json.loads((root / f"{name}-networks.json").read_text()))
              for name in ("web", "platform-api", "ai-api")
          }
          suffix = lambda names, network: any(name.endswith("_" + network) for name in names)
          assert suffix(networks["web"], "frontend") and not suffix(networks["web"], "backend")
          assert suffix(networks["ai-api"], "backend") and not suffix(networks["ai-api"], "frontend")
          assert suffix(networks["platform-api"], "frontend") and suffix(networks["platform-api"], "backend")
          print("Network isolation verified: web cannot reach AI API directly.")
          PY
      - name: Collect redacted container diagnostics
        if: always()
        run: |
          set +x
          set -u
          env_file="$RUNNER_TEMP/travelos-ci.env"
          if [ -f "$env_file" ]; then
            docker compose --env-file "$env_file" -f docker-compose.prod.yml ps --all || true
            for container_id in $(docker compose --env-file "$env_file" -f docker-compose.prod.yml ps -aq); do
              docker inspect "$container_id" --format 'Container={{.Name}} Image={{.Config.Image}} State={{json .State}} RestartCount={{.RestartCount}} Healthcheck={{json .Config.Healthcheck}}' || true
            done
            for image in $(docker compose --env-file "$env_file" -f docker-compose.prod.yml images -q | sort -u); do
              docker image inspect "$image" --format 'Image={{.Id}} OS={{.Os}} Architecture={{.Architecture}} Digests={{json .RepoDigests}}' || true
            done
            docker compose --env-file "$env_file" -f docker-compose.prod.yml logs --no-color 2>&1 | python -c '
          import pathlib, re, sys
          text = sys.stdin.read()
          env = {}
          for line in pathlib.Path(sys.argv[1]).read_text(errors="replace").splitlines():
              if "=" in line:
                  k, v = line.split("=", 1)
                  env[k] = v
          for value in env.values():
              if value:
                  text = text.replace(value, "[REDACTED]")
          text = re.sub(r"(?i)(password\s*[=:]\s*)[^;\s]+", r"\1[REDACTED]", text)
          text = re.sub(r"(?i)(jwt_signing_key\s*[=:]\s*)[^;\s]+", r"\1[REDACTED]", text)
          text = re.sub(r"(?i)(postgres_password\s*[=:]\s*)[^;\s]+", r"\1[REDACTED]", text)
          text = re.sub(r"(?i)\b[0-9a-f]{96}\b", "[REDACTED]", text)
          sys.stdout.write(text)
          ' "$env_file" || true
          else
            echo "Temporary environment file unavailable; skipping Compose diagnostics."
          fi
      - name: Stop deployment stack and remove temporary credentials
        if: always()
        run: |
          set +x
          env_file="$RUNNER_TEMP/travelos-ci.env"
          if [ -f "$env_file" ]; then
            docker compose --env-file "$env_file" -f docker-compose.prod.yml down --volumes --remove-orphans >/dev/null 2>&1 || true
          fi
          rm -f "$env_file"
