name: TravelOS CI

on:
  push:
    branches: [main, 'stage*']
  pull_request:
    branches: [main, 'stage*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: Web typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build

  ai-api:
    name: AI API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/ai-api/requirements.txt
      - name: Run tests
        run: pytest -q

  platform-api:
    name: Platform API build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore services/platform-api/TravelOS.PlatformApi.csproj
      - name: Build
        run: dotnet build services/platform-api/TravelOS.PlatformApi.csproj --no-restore --configuration Release

  platform-api-tests:
    name: Platform API unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Run platform API tests
        run: dotnet test tests/platform-api-tests/TravelOS.PlatformApi.Tests.csproj --configuration Release

  platform-api-integration-tests:
    name: Platform API PostgreSQL integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: travelos_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d travelos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Prepare integration-test database
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          for migration in \
            001_initial_schema.sql \
            002_identity_schema.sql \
            003_itinerary_constraints.sql \
            003_trip_invitations.sql \
            004_trip_member_preferences.sql \
            005_group_polls.sql \
            006_shared_expenses.sql \
            007_trip_repayments.sql \
            008_trip_expense_audits.sql \
            009_trip_receipts.sql \
            010_currency_conversions.sql \
            011_conversion_source_expense_date.sql \
            012_trip_budget_alerts.sql \
            013_trip_weather_assessments.sql \
            014_trip_flights.sql \
            015_flight_journey_groups.sql \
            016_activity_schedule_times.sql \
            017_trip_notifications.sql
          do
            echo "Applying $migration"
            psql -h localhost -U postgres -d travelos_test -v ON_ERROR_STOP=1 -f "database/migrations/$migration"
          done
      - name: Run PostgreSQL-backed API integration tests
        env:
          TRAVELOS_TEST_CONNECTION_STRING: Host=localhost;Port=5432;Database=travelos_test;Username=postgres;Password=postgres
        run: dotnet test tests/platform-api-tests/TravelOS.PlatformApi.Tests.csproj --configuration Release --logger "console;verbosity=normal"


  browser-e2e:
    name: Cross-browser, mobile and accessibility E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: travelos_e2e
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d travelos_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply migrations to disposable E2E database
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          for migration in \
            001_initial_schema.sql \
            002_identity_schema.sql \
            003_itinerary_constraints.sql \
            003_trip_invitations.sql \
            004_trip_member_preferences.sql \
            005_group_polls.sql \
            006_shared_expenses.sql \
            007_trip_repayments.sql \
            008_trip_expense_audits.sql \
            009_trip_receipts.sql \
            010_currency_conversions.sql \
            011_conversion_source_expense_date.sql \
            012_trip_budget_alerts.sql \
            013_trip_weather_assessments.sql \
            014_trip_flights.sql \
            015_flight_journey_groups.sql \
            016_activity_schedule_times.sql \
            017_trip_notifications.sql
          do
            echo "Applying $migration"
            psql -h localhost -U postgres -d travelos_e2e -v ON_ERROR_STOP=1 -f "database/migrations/$migration"
          done
      - name: Install web dependencies
        working-directory: apps/web
        run: npm install
      - name: Typecheck web application
        working-directory: apps/web
        run: npm run typecheck
      - name: Build web application
        working-directory: apps/web
        run: npm run build
      - name: Install Chromium, Firefox, WebKit and Linux dependencies
        working-directory: apps/web
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Start deterministic AI recommendation mock
        run: |
          set -euo pipefail
          E2E_AI_MOCK_PORT=8011 node tests/e2e/mock-ai-server.mjs > "$RUNNER_TEMP/travelos-ai-mock.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/travelos-ai-mock.pid"
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8011/health >/dev/null; then
              echo "AI recommendation mock is ready"
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/travelos-ai-mock.log"
          exit 1
      - name: Start Platform API against E2E PostgreSQL database
        env:
          ASPNETCORE_URLS: http://127.0.0.1:8080
          ASPNETCORE_ENVIRONMENT: Testing
          ConnectionStrings__TravelOS: Host=localhost;Port=5432;Database=travelos_e2e;Username=postgres;Password=postgres
          Jwt__Issuer: TravelOS.Playwright
          Jwt__Audience: TravelOS.Playwright.Client
          Jwt__SigningKey: TravelOS-Playwright-Integration-Test-Signing-Key-2026
          RateLimits__AuthPerMinute: 30
          Cors__AllowedOrigins__0: http://127.0.0.1:5173
          AiService__BaseUrl: http://127.0.0.1:8011
          Receipts__StoragePath: ${{ runner.temp }}/travelos-playwright-receipts
        run: |
          set -euo pipefail
          mkdir -p "$Receipts__StoragePath"
          dotnet run --project services/platform-api/TravelOS.PlatformApi.csproj --configuration Release --no-launch-profile > "$RUNNER_TEMP/travelos-platform-api.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/travelos-platform-api.pid"
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null; then
              echo "Platform API is ready"
              exit 0
            fi
            if ! kill -0 "$(cat "$RUNNER_TEMP/travelos-platform-api.pid")" 2>/dev/null; then
              cat "$RUNNER_TEMP/travelos-platform-api.log"
              exit 1
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/travelos-platform-api.log"
          exit 1
      - name: Run Chromium, Firefox, WebKit, mobile and tablet journeys
        working-directory: apps/web
        env:
          CI: "true"
          VITE_PLATFORM_API_URL: http://127.0.0.1:8080
          E2E_API_URL: http://127.0.0.1:8080
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:5173
        run: npm run test:e2e
      - name: Upload cross-browser reports, screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: travelos-playwright-e2e-results
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
            ${{ runner.temp }}/travelos-platform-api.log
            ${{ runner.temp }}/travelos-ai-mock.log
          if-no-files-found: ignore
          retention-days: 14

  database-migrations:
    name: PostgreSQL migration validation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: travelos
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d travelos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply all database migrations
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          for migration in \
            001_initial_schema.sql \
            002_identity_schema.sql \
            003_itinerary_constraints.sql \
            003_trip_invitations.sql \
            004_trip_member_preferences.sql \
            005_group_polls.sql \
            006_shared_expenses.sql \
            007_trip_repayments.sql \
            008_trip_expense_audits.sql \
            009_trip_receipts.sql \
            010_currency_conversions.sql \
            011_conversion_source_expense_date.sql \
            012_trip_budget_alerts.sql \
            013_trip_weather_assessments.sql \
            014_trip_flights.sql \
            015_flight_journey_groups.sql \
            016_activity_schedule_times.sql \
            017_trip_notifications.sql
          do
            echo "Applying $migration"
            psql -h localhost -U postgres -d travelos -v ON_ERROR_STOP=1 -f "database/migrations/$migration"
          done

  container-deployment-smoke:
    name: Container deployment build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Create disposable deployment environment
        run: |
          cat > deploy/ci.env <<'EOF'
          POSTGRES_DB=travelos
          POSTGRES_USER=travelos
          POSTGRES_PASSWORD=TravelOS-CI-Only-Database-Password-2026
          TRAVELOS_CONNECTION_STRING=Host=postgres;Port=5432;Database=travelos;Username=travelos;Password=TravelOS-CI-Only-Database-Password-2026
          JWT_ISSUER=TravelOS.CI
          JWT_AUDIENCE=TravelOS.CI.Client
          JWT_SIGNING_KEY=TravelOS-CI-Only-Signing-Key-Not-For-Production-2026
          CORS_ALLOWED_ORIGIN=http://127.0.0.1:8088
          WEB_BIND_ADDRESS=127.0.0.1
          WEB_PORT=8088
          AI_PROVIDER=demo
          OPENAI_API_KEY=
          OPENAI_MODEL=gpt-4.1-mini
          AI_RECEIPT_PROVIDER=demo
          FLIGHTAWARE_API_KEY=
          EOF
          chmod 600 deploy/ci.env
      - name: Validate Compose configuration
        run: docker compose --env-file deploy/ci.env -f docker-compose.prod.yml config --quiet
      - name: Build all application images
        run: docker compose --env-file deploy/ci.env -f docker-compose.prod.yml build
      - name: Start deployment stack
        run: docker compose --env-file deploy/ci.env -f docker-compose.prod.yml up --detach --wait --wait-timeout 240
      - name: Verify web, API and AI health
        run: |
          set -euo pipefail
          curl --fail --silent --show-error http://127.0.0.1:8088/ -o /dev/null
          curl --fail --silent --show-error http://127.0.0.1:8088/health
          docker compose --env-file deploy/ci.env -f docker-compose.prod.yml exec -T ai-api python -c "import json,urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:8001/health')); assert data['mode']=='demo', data; print(data)"
          docker compose --env-file deploy/ci.env -f docker-compose.prod.yml exec -T platform-api sh -c 'test -w /var/lib/travelos/receipts'
      - name: Verify all database migrations were recorded
        run: |
          set -euo pipefail
          count="$(docker compose --env-file deploy/ci.env -f docker-compose.prod.yml exec -T postgres psql -U travelos -d travelos -Atc 'SELECT count(*) FROM travelos_migration_history')"
          echo "Recorded migrations: $count"
          test "$count" = "18"
      - name: Verify internal-only database and API ports
        run: |
          set -euo pipefail
          ports="$(docker compose --env-file deploy/ci.env -f docker-compose.prod.yml port postgres 5432 || true)"
          test -z "$ports"
          ports="$(docker compose --env-file deploy/ci.env -f docker-compose.prod.yml port platform-api 8080 || true)"
          test -z "$ports"
      - name: Collect container diagnostics
        if: always()
        run: docker compose --env-file deploy/ci.env -f docker-compose.prod.yml ps --all
      - name: Stop deployment stack
        if: always()
        run: docker compose --env-file deploy/ci.env -f docker-compose.prod.yml down --volumes --remove-orphans
