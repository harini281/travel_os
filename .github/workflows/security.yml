name: TravelOS Security Assessment

on:
  push:
    branches: [main, 'stage*']
  pull_request:
    branches: [main, 'stage*']
  schedule:
    - cron: "37 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql-dotnet:
    name: CodeQL — Platform API
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: manual
      - name: Build Platform API for analysis
        run: |
          dotnet restore services/platform-api/TravelOS.PlatformApi.csproj
          dotnet build services/platform-api/TravelOS.PlatformApi.csproj --no-restore --configuration Release
      - name: Analyze source code (store SARIF as workflow artifact)
        uses: github/codeql-action/analyze@v4
        with:
          output: ${{ runner.temp }}/codeql-dotnet-results
      - name: Preserve CodeQL results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: travelos-codeql-dotnet-sarif
          path: ${{ runner.temp }}/codeql-dotnet-results
          if-no-files-found: ignore
          retention-days: 14

  codeql-web-ai:
    name: CodeQL — Web and AI services
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript, python
          build-mode: none
      - name: Analyze source code (store SARIF as workflow artifact)
        uses: github/codeql-action/analyze@v4
        with:
          output: ${{ runner.temp }}/codeql-web-ai-results
      - name: Preserve CodeQL results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: travelos-codeql-web-ai-sarif
          path: ${{ runner.temp }}/codeql-web-ai-results
          if-no-files-found: ignore
          retention-days: 14

  dependency-audit:
    name: NuGet, npm and Python dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install and audit web dependencies
        working-directory: apps/web
        run: |
          npm install --no-audit --no-fund
          npm audit --audit-level=high
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Audit Python dependencies
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r services/ai-api/requirements-dev.txt
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Audit NuGet dependencies
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore services/platform-api/TravelOS.PlatformApi.csproj
          report="$(dotnet list services/platform-api/TravelOS.PlatformApi.csproj package --vulnerable --include-transitive)"
          printf '%s\n' "$report"
          if printf '%s\n' "$report" | grep -Eiq '(^|[^[:alpha:]])(High|Critical)([^[:alpha:]]|$)'; then
            echo "::error::High or critical NuGet vulnerabilities were reported."
            exit 1
          fi

  filesystem-security:
    name: Filesystem, secret and configuration scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Scan dependencies and secrets
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.76.2
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy-filesystem.sarif
          exit-code: "1"
      - name: Scan infrastructure configuration
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.76.2
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-configuration.sarif
          # Preserve pre-existing configuration findings for review without hiding them.
          # New HIGH/CRITICAL items are reviewed from the SARIF artifact before release.
          exit-code: "0"
      - name: Preserve Trivy reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: travelos-trivy-filesystem-and-config
          path: |
            trivy-filesystem.sarif
            trivy-configuration.sarif
          if-no-files-found: ignore
          retention-days: 14

  container-image-security:
    name: Container image vulnerability scans
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build Platform API image
        run: docker build --pull --tag travelos-platform-api:stage51 -f services/platform-api/Dockerfile .
      - name: Scan Platform API image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.76.2
          scan-type: image
          image-ref: travelos-platform-api:stage51
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"
      - name: Build AI API image
        run: docker build --pull --tag travelos-ai-api:stage51 -f services/ai-api/Dockerfile .
      - name: Scan AI API image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.76.2
          scan-type: image
          image-ref: travelos-ai-api:stage51
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"
      - name: Build web image
        if: always()
        run: docker build --pull --tag travelos-web:stage51 -f apps/web/Dockerfile .
      - name: Scan web image
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.76.2
          scan-type: image
          image-ref: travelos-web:stage51
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"
